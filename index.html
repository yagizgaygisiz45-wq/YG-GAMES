<!DOCTYPE html>
<html lang="tr">
<head>
    <!-- GOOGLE SEARCH CONSOLE DOĞRULAMA KODU -->
    <meta name="google-site-verification" content="oQ7GslXH8L64UG7_k2v8oVTdOxy7vUmwIwVIA0Ic4EU" />

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>YG GAMES | Official Game Studio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: manipulation;
            user-select: none;
        }

        body {
            background-color: #04060c;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* HAREKETLİ ARKA PLAN AĞI (CANVAS) */
        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        /* HEADER */
        header {
            background: rgba(8, 12, 22, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 2px solid rgba(0, 240, 255, 0.3);
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 2px;
            color: #00f0ff;
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.8);
            animation: logoGlow 3s infinite alternate;
        }

        @keyframes logoGlow {
            0% { text-shadow: 0 0 10px rgba(0, 240, 255, 0.5); }
            100% { text-shadow: 0 0 25px rgba(0, 240, 255, 1), 0 0 35px rgba(0, 114, 255, 0.8); }
        }

        .logo span { color: #ffffff; }

        nav a {
            color: #94a3b8;
            text-decoration: none;
            margin-left: 20px;
            font-weight: 600;
            font-size: 14px;
            transition: 0.3s;
        }

        nav a:hover {
            color: #00f0ff;
            text-shadow: 0 0 8px #00f0ff;
        }

        /* MAIN PORTAL */
        #portalPage {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            z-index: 10;
        }

        .hero {
            padding: 60px 5% 30px 5%;
            text-align: center;
        }

        .hero h1 {
            font-size: 34px;
            margin-bottom: 12px;
            background: linear-gradient(90deg, #ffffff, #00f0ff, #ff0055);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientText 4s linear infinite;
        }

        @keyframes gradientText {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        .hero p {
            color: #94a3b8;
            font-size: 14px;
            max-width: 550px;
            margin: 0 auto;
            line-height: 1.6;
        }

        .container {
            padding: 25px 5%;
            width: 100%;
            max-width: 850px;
        }

        .section-title {
            font-size: 20px;
            margin-bottom: 25px;
            border-left: 4px solid #00f0ff;
            padding-left: 12px;
            color: #fff;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
        }

        .empty-box {
            background: rgba(17, 23, 38, 0.6);
            border: 1px dashed rgba(0, 240, 255, 0.3);
            border-radius: 18px;
            padding: 40px 20px;
            text-align: center;
            color: #94a3b8;
            font-size: 15px;
        }
    </style>
</head>
<body>

    <!-- ARKA PLAN ANİMASYON CANVAS'I -->
    <canvas id="bgCanvas"></canvas>

    <!-- PORTAL EKRANI -->
    <div id="portalPage">
        <header style="width: 100%;">
            <div class="logo">YG <span>GAMES</span></div>
            <nav>
                <a href="#games">Oyunlar</a>
                <a href="https://www.youtube.com/@yg.games1" target="_blank">YouTube</a>
                <a href="https://www.tiktok.com/@yg.sirket" target="_blank">TikTok</a>
            </nav>
        </header>

        <section class="hero">
            <h1>YG Software & Game Studio</h1>
            <p>Yerli ve bağımsız yazılım teknolojilerini burada keşfedin. Doğrudan tarayıcınız üzerinden yüksek performansla oynayın!</p>
        </section>

        <main class="container" id="games">
            <h2 class="section-title">Oyun Kütüphanesi</h2>
            <div class="empty-box">
                🕹️ Yeni projeler ve oyunlar çok yakında burada listelenecektir. Takipte kalın!
            </div>
        </main>
    </div>

    <script>
        // ARKA PLAN DİNAMİK AĞ ANİMASYONU
        const bgCanvas = document.getElementById('bgCanvas');
        const bgCtx = bgCanvas.getContext('2d');
        let bgDots = [];

        function initBgAnimation() {
            bgCanvas.width = window.innerWidth;
            bgCanvas.height = window.innerHeight;
            bgDots = [];
            for (let i = 0; i < 45; i++) {
                bgDots.push({
                    x: Math.random() * bgCanvas.width,
                    y: Math.random() * bgCanvas.height,
                    vx: (Math.random() - 0.5) * 0.8,
                    vy: (Math.random() - 0.5) * 0.8,
                    size: Math.random() * 2 + 1
                });
            }
        }

        function drawBgAnimation() {
            bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
            for (let i = 0; i < bgDots.length; i++) {
                let d = bgDots[i];
                d.x += d.vx; d.y += d.vy;
                if (d.x < 0 || d.x > bgCanvas.width) d.vx *= -1;
                if (d.y < 0 || d.y > bgCanvas.height) d.vy *= -1;

                bgCtx.fillStyle = '#00f0ff';
                bgCtx.beginPath();
                bgCtx.arc(d.x, d.y, d.size, 0, Math.PI * 2);
                bgCtx.fill();

                for (let j = i + 1; j < bgDots.length; j++) {
                    let d2 = bgDots[j];
                    let dist = Math.hypot(d.x - d2.x, d.y - d2.y);
                    if (dist < 120) {
                        bgCtx.strokeStyle = `rgba(0, 240, 255, ${1 - dist / 120})`;
                        bgCtx.lineWidth = 0.5;
                        bgCtx.beginPath();
                        bgCtx.moveTo(d.x, d.y);
                        bgCtx.lineTo(d2.x, d2.y);
                        bgCtx.stroke();
                    }
                }
            }
            requestAnimationFrame(drawBgAnimation);
        }

        initBgAnimation();
        drawBgAnimation();

        window.addEventListener('resize', initBgAnimation);
    </script>
</body>
</html>
